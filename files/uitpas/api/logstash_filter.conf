# Keep every severity. ODL messages may span many lines and contain
# optional header fields between the logger name and the message.
grok {
  match => {
    "message" => "(?m)^\[%{TIMESTAMP_ISO8601:[@metadata][uitpas_timestamp]}\] \[%{DATA:[payara][version]}\] \[%{WORD:severity}\] \[%{DATA:[payara][message_id]}\] \[%{DATA:logger}\] %{DATA:[payara][context]}\[\[(?<log_message>.*)\]\]\s*$"
  }
  tag_on_failure => ["_uitpas_parse_failure"]
}

if "_uitpas_parse_failure" not in [tags] {
  date {
    match => ["[@metadata][uitpas_timestamp]", "ISO8601"]
    tag_on_failure => ["_uitpas_date_failure"]
  }
  mutate {
    remove_field => ["message"]
  }
}

# Retain the raw message and failure tags when parsing fails, and route
# those events to the same index so failures remain visible.
mutate {
  add_field => {
    "environment"              => "%{[fields][environment]}"
    "servername"               => "%{[fields][servername]}"
    "[@metadata][log_type]"     => "%{[fields][log_type]}"
    "[@metadata][environment]"  => "%{[fields][environment]}"
  }
}
